services:
  frontend:
    build: ./app
    ports:
      - "8081:8081"
    volumes:
      - ./app:/app
      - /app/node_modules
    environment:
      EXPO_NO_TELEMETRY: "1"
      # Open the site from the host; containers cannot launch a desktop browser.
      BROWSER: "none"
      # Browser-visible backend URL. The browser uses localhost because port 8080 is published.
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8080}
    stdin_open: true
    tty: true

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://online_shop:online_shop@db:5432/online_shop?sslmode=disable"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081}
      # Local development defaults only; supply unique secrets for deployment.
      CURSOR_SECRET: ${CURSOR_SECRET:-local-development-cursor-secret-change-before-deploy}
      BOOTSTRAP_SHOP_ID: ${BOOTSTRAP_SHOP_ID:-demo-shop}
      BOOTSTRAP_SHOP_NAME: ${BOOTSTRAP_SHOP_NAME:-Demo shop}
      BOOTSTRAP_OWNER_NAME: ${BOOTSTRAP_OWNER_NAME:-Demo owner}
      BOOTSTRAP_PHONE: ${BOOTSTRAP_PHONE:-99996666}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-admintest}
      BOOTSTRAP_CHATBOT_KEY: ${BOOTSTRAP_CHATBOT_KEY:-local-development-chatbot-key-change-before-deploy}
      BOOTSTRAP_BANK_KEY: ${BOOTSTRAP_BANK_KEY:-local-development-bank-key-change-before-deploy}
      # Only seeds fixtures for the local demo-shop tenant.
      BOOTSTRAP_DEMO_DATA: ${BOOTSTRAP_DEMO_DATA:-true}
      BOOTSTRAP_WEBHOOK_URL: ${BOOTSTRAP_WEBHOOK_URL:-}
      BOOTSTRAP_WEBHOOK_SECRET: ${BOOTSTRAP_WEBHOOK_SECRET:-}
      BOOTSTRAP_SMS_URL: ${BOOTSTRAP_SMS_URL:-}
      BOOTSTRAP_SMS_SECRET: ${BOOTSTRAP_SMS_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: online_shop
      POSTGRES_USER: online_shop
      POSTGRES_PASSWORD: online_shop
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U online_shop -d online_shop"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
