# Isolated, disposable integration database. No application database or host ports.
services:
  test-db:
    image: postgres:17
    environment:
      POSTGRES_DB: shop_test
      POSTGRES_USER: shop_test
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop_test -d shop_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  backend-test:
    image: golang:1.26-alpine
    working_dir: /src
    volumes:
      - ./backend:/src
      - ./docs/api/openapi.yaml:/contract/openapi.yaml:ro
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      TEST_DATABASE_URL: postgres://shop_test:test-only-password@test-db:5432/shop_test?sslmode=disable
      OPENAPI_PATH: /contract/openapi.yaml
    depends_on:
      test-db:
        condition: service_healthy
    command: ["sh", "-c", "go vet ./... && go test -count=1 ./..."]
volumes:
  go-mod:
  go-build:
